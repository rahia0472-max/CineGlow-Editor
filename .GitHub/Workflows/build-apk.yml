name: Build CineGlow APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download ZIP from repository
        uses: actions/checkout@v6

      - name: Extract project
        run: |
          unzip -o cineglow-editor-admob-banner.zip -d project

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build APK
        working-directory: project
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CineGlow-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
